appId: com.ibuddy.app
productName: iBuddy
npmRebuild: false
afterPack: build/after-pack.cjs
directories:
  buildResources: build
  output: dist
publish:
  provider: github
  owner: nipun-mohan
  repo: iBuddy
  releaseType: release
files:
  - "out/**"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron/*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: iBuddy
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: iBuddy
  uninstallDisplayName: iBuddy
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: icon.png
  identity: "-"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: "iBuddy uses the camera only when a feature explicitly requests it."
    NSMicrophoneUsageDescription: "iBuddy uses the microphone to transcribe interview audio in real time."
    NSAudioCaptureUsageDescription: "iBuddy captures system audio so interview questions can be transcribed in real time."
    NSScreenCaptureUsageDescription: "iBuddy captures the screen when you request AI screen analysis."
    NSDocumentsFolderUsageDescription: "iBuddy accesses documents only when you select them."
    NSDownloadsFolderUsageDescription: "iBuddy accesses downloads only when you select them."
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: iBuddy
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
